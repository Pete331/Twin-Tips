# Render Blueprint. Declares both services so the deployment is reproducible
# rather than a set of console settings nobody can audit later.
#
# Create it from the Render dashboard with New > Blueprint, pointed at this
# repository. Render prompts for every value marked `sync: false`, so no
# secret is ever committed here.

envVarGroups:
  # Shared by the web service and the cron job, so the connection string is
  # entered once and stays consistent between them.
  - name: twin-tips-shared
    envVars:
      # mongodb+srv://... from Atlas. Must include the database name
      # (/twin-tips) before the query string, or the driver connects to
      # "test" and the app silently finds no data.
      - key: MONGODB_URI
        sync: false
      # Squiggle asks for a contact address in the User-Agent and may refuse
      # or ban requests that omit one.
      - key: SQUIGGLE_CONTACT
        sync: false

services:
  - type: web
    name: twin-tips
    runtime: node
    # Closest Render region to Australia. Put the Atlas cluster in the same
    # part of the world, or every query pays a round trip across the Pacific.
    region: singapore
    plan: free
    # The root `install` lifecycle script installs the client's dependencies,
    # so this covers both packages.
    #
    # --include=dev is required, and its absence is not obvious. NODE_ENV is
    # production below, which makes npm skip devDependencies - and vite is one
    # of the client's, so the build installs everything except the bundler it
    # is about to run and fails with "vite: not found". The flag reaches the
    # client's install too, because npm passes its config to lifecycle scripts
    # in the environment.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - fromGroup: twin-tips-shared
      - key: NODE_ENV
        value: production
      # Render generates a random 256-bit value, so nobody has to invent or
      # paste one. server.js refuses to start in production without it.
      - key: SESSION_SECRET
        generateValue: true
      # The app's own public URL, e.g. https://twin-tips.onrender.com. Password
      # reset emails link to it, so getting it wrong breaks the only recovery
      # path for someone already locked out. Render knows the hostname once the
      # service exists, so fill this in after the first deploy - server.js
      # refuses to start in production without it.
      - key: APP_URL
        sync: false
      # Password reset mail. Render blocks outbound SMTP on 25, 465 and 587
      # from free services, so no SMTP host is reachable here - measured, not
      # assumed: a reset request against this service hung for 120 seconds
      # before failing. BREVO_API_KEY sends over HTTPS instead and is what
      # this deployment actually uses. The SMTP keys below are kept for local
      # work and for anywhere the ports are open.
      - key: BREVO_API_KEY
        sync: false
      #
      # EMAIL_USER and EMAIL_PASSWORD are still read as fallbacks, so an
      # existing deployment keeps sending until these are set.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # The address the mail comes from. Must be one the provider has verified,
      # or it will accept the message and never deliver it.
      - key: MAIL_FROM
        sync: false
    # PORT is deliberately absent. Render injects it, and overriding it binds
    # the server to a port the proxy is not forwarding to.

  - type: cron
    name: twin-tips-season-sync
    runtime: node
    region: singapore
    # Cron jobs cannot run on the free instance type. Billed by active running
    # time with a $1/month minimum, and a sync takes seconds.
    plan: starter
    # No --include=dev here, unlike the web service: this job runs a Node
    # script and never builds the client, so it has no use for vite.
    buildCommand: npm install
    # No year argument: the script defaults to the current year, so this keeps
    # working next season without anyone editing the schedule.
    startCommand: npm run sync
    # Hourly. This is the only thing that updates scores now that the browser
    # no longer writes fixtures back, so the interval decides how stale a
    # score can look while a round is being played - daily would have meant
    # up to a day.
    #
    # Frequency is effectively free: billing is by running time against a
    # $1/month minimum, and 24 runs a day of a few seconds each comes to
    # around half an hour a month, nowhere near the floor. Hourly rather than
    # every few minutes is about being a reasonable client of Squiggle, not
    # about cost.
    schedule: "0 * * * *"
    envVars:
      - fromGroup: twin-tips-shared
