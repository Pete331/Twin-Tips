# Lint, every test and the build, on every push.
#
# Render deploys master, and until this existed nothing checked what landed
# there - 800-odd tests ran only when somebody remembered. render.yaml now asks
# Render to deploy only a commit whose checks have passed (autoDeployTrigger).
#
# The database is real: most of what matters here - the routes, the scoring,
# the pools - is tested against MongoDB. Those tests skip themselves when no
# database is listening, which would let a job whose database never came up
# go green having tested a fraction of the app. So the server tests run with
# scripts/test/failOnSkip.mjs attached, and any skip fails the run.
#
# On push rather than pull_request: this repository has no forks to guard
# against, and it means a branch is checked before its pull request is opened.

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # 7.0, not the 8 used in local development, until MongoDB supports new
      # Linux kernels. MongoDB 8.0 and later refuse to start on kernel 6.19 or
      # newer - "Linux kernel versions 6.19 and newer has a known
      # incompatibility with this version of MongoDB" - because of the TCMalloc
      # they bundle, and GitHub's runners moved to kernel 7.0 in November 2026,
      # so every run failed before a single step. 7.0 predates that TCMalloc
      # and starts fine there (checked on the runners, 7.0.45). Move back to
      # mongo:8 once MongoDB announces kernel 6.19+ support:
      # https://www.mongodb.com/community/forums/t/mongodb-8-x-and-linux-kernel-6-19/337547
      #
      # Local development stays on 8, so the tests still run against both.
      #
      # The health check holds the job's steps back until the server answers,
      # rather than letting the first database test race it.
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      # .nvmrc says 24, as does engines in package.json - which is what Render
      # runs. Read from the file, so CI cannot be left on a version the file
      # has moved on from.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # The root package's install script installs the client's dependencies
      # too, the same way Render's build does.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Reports, never rewrites. A file that fails here is fixed with
      # npm run format and committed.
      - name: Formatting
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
