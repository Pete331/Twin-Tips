name: CI
on:
  push:
permissions:
  contents: read
jobs:
  check:
    name: Diagnose mongo image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Try each image
        run: |
          say() { msg=$(printf '%s' "$2" | tail -c 800 | tr '\n' '|' | tr -d '\r'); echo "::notice title=$1::$msg"; }
          say docker "$(docker version --format 'server {{.Server.Version}} api {{.Server.APIVersion}}' 2>&1) kernel $(uname -r) os $(. /etc/os-release; echo $VERSION_ID)"
          for img in mongo:8 mongo:8.0 mongo:7; do
            name=$(echo "$img" | tr ':.' '__')
            out=$(docker pull "$img" 2>&1 | tail -2); say "pull $img" "$out"
            ver=$(docker image inspect "$img" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>&1 | grep -E 'MONGO_VERSION|MONGO_MAJOR')
            sh=$(docker run --rm --entrypoint sh "$img" -c 'command -v mongosh; command -v mongod; id -u' 2>&1)
            say "image $img" "$ver // $sh"
            docker run -d --name "$name" --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'" --health-interval 5s --health-timeout 5s --health-retries 12 "$img" >/dev/null 2>&1
            sleep 45
            st=$(docker inspect "$name" --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}} streak={{.State.Health.FailingStreak}}{{end}} err={{.State.Error}}' 2>&1)
            say "state $img" "$st"
            hl=$(docker inspect "$name" --format '{{if .State.Health}}{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}{{end}}' 2>&1 | tail -c 400)
            say "healthlog $img" "$hl"
            lg=$(docker logs --tail 4 "$name" 2>&1 | cut -c1-260)
            say "logs $img" "$lg"
            docker rm -f "$name" >/dev/null 2>&1
          done
