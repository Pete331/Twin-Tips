<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="/favicon.ico">
    <!-- Materialize was loaded here and has been removed. Nothing in the app
         used its components - this is MUI throughout - but it styled bare
         elements through attribute selectors like input[type=text], which
         out-specify the class selectors MUI generates through emotion. So it
         quietly won every conflict and undid MUI's own field styling: padding
         stripped so text sat against the border, a stray border-bottom under
         the outline, a fixed height. MUI's CssBaseline provides the reset it
         was incidentally supplying, and removes a third-party CDN from the
         critical path at the same time. -->
    <title>Twin Tips</title>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
